<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>雨の窓</title>
<meta name="description" content="雨が伝う夜の窓を眺めながら、静かな曲を流し続けるページです。">
<style>
  html, body { margin: 0; height: 100%; background: #05070d; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; }

  #overlay {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font: 20px/1.4 -apple-system, "Hiragino Sans", sans-serif;
    cursor: pointer;
    user-select: none;
    z-index: 10;
  }

  #mute-btn {
    position: fixed;
    right: 12px;
    bottom: 12px;
    color: rgba(255, 255, 255, 0.7);
    font: 12px/1.4 -apple-system, "Hiragino Sans", sans-serif;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.25);
    padding: 4px 10px;
    border-radius: 12px;
    cursor: pointer;
    z-index: 5;
  }
  #mute-btn:hover,
  #mute-btn:focus-visible {
    color: #fff;
    border-color: rgba(255, 255, 255, 0.5);
  }

  footer {
    position: fixed;
    left: 12px;
    bottom: 12px;
    font: 12px/1.4 -apple-system, "Hiragino Sans", sans-serif;
    color: rgba(255, 255, 255, 0.55);
    z-index: 5;
  }
  footer a {
    color: rgba(255, 255, 255, 0.75);
    text-decoration: none;
  }
  footer a:hover,
  footer a:focus-visible {
    text-decoration: underline;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<audio id="bgm" loop preload="auto" src="rain.mp3"></audio>
<div id="overlay">クリックして再生</div>
<button id="mute-btn" type="button">音を止める</button>
<footer>
  <a href="../">追い風</a> ／ <a href="../tips/">操作メモ</a> ／ <a href="../books/">読書</a> ／ <a href="../hokkaido/">北海道の窓</a> ／ <a href="../chords/">コード進行お試しページ</a> ／ <a href="../humming/">ハミング再生ページ</a> ／ <a href="../melody/">メロディ・バリエーション比較</a>
</footer>
<script>
"use strict";

/* ------------------------------------------------------------------
   調整用の定数。0 にすれば個別に無効化できる。
------------------------------------------------------------------ */
const CFG = {
  // 背景（ガラスの向こうの夜景）
  LIGHTS:        44,     // ボケ光の数
  TWINKLE:       0.30,   // またたきの強さ 0で止まる
  DRIFT:         14,     // ゆっくりした揺れの振幅(px) 0で静止

  // ガラス
  FOG:           0.13,   // 曇りの濃さ 0で曇りなし
  FOG_RECOVER:   0.004,  // 曇りが戻る速さ（大きいほど早く曇る）

  // 水滴
  SMALL_SPAWN:   5,      // 1フレームに増える細かい水滴の数
  SMALL_MAX:     900,    // 画面に残す細かい水滴の上限
  BIG_SPAWN:     0.055,  // 大粒が生まれる確率/フレーム
  SLIDE_R:       4.2,    // この半径を超えると滑り出す
  GRAVITY:       0.22,
  FRICTION:      0.93,   // 終端速度を決める
  WOBBLE:        0.45,   // 横揺れ 0で真っ直ぐ落ちる
  CATCH:         0.03,   // 途中で引っかかって止まる確率/フレーム

  // 見え方
  REFRACT:       1.35,   // 水滴の中の拡大率
  FLIP:          true,   // 水滴の中を上下反転（実際の水滴レンズ）
  SHINE:         0.22,   // 水滴のつや
};

const PALETTE = ["#ffb46b", "#ff7a59", "#7fd4c1", "#8fa8ff", "#ffd98a", "#e58bd0"];

/* ------------------------------------------------------------------ */

const cv  = document.getElementById("c");
const ctx = cv.getContext("2d");

let W = 0, H = 0, DPR = 1;
let sharp, sharpC;   // 水滴の中に映す用（等倍）
let blur,  blurC;    // 縮小→拡大でぼかしたガラス越しの景色
let fog,   fogC;     // 曇りマスク
let drop,  dropC;    // 水滴レイヤ
let vignette;

let lights = [];
const smalls = [];   // {x, y, r}
const bigs   = [];   // {x, y, r, vx, vy, px, py}

const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

function makeCanvas(w, h) {
  const c = document.createElement("canvas");
  c.width = Math.max(1, Math.round(w));
  c.height = Math.max(1, Math.round(h));
  return c;
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  cv.width  = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  sharp = makeCanvas(W, H);            sharpC = sharp.getContext("2d");
  blur  = makeCanvas(W / 7, H / 7);    blurC  = blur.getContext("2d");
  fog   = makeCanvas(W / 3, H / 3);    fogC   = fog.getContext("2d");
  drop  = makeCanvas(W, H);            dropC  = drop.getContext("2d");

  const g = ctx.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.25,
                                     W / 2, H * 0.5,  Math.max(W, H) * 0.75);
  g.addColorStop(0, "rgba(0,0,0,0)");
  g.addColorStop(1, "rgba(0,0,0,0.62)");
  vignette = g;

  layoutLights();
  smalls.length = 0;
  bigs.length = 0;
}

function layoutLights() {
  lights = [];
  for (let i = 0; i < CFG.LIGHTS; i++) {
    const near = Math.random() < 0.35;
    lights.push({
      x: Math.random(),
      y: 0.18 + Math.pow(Math.random(), 0.7) * 0.78,
      r: (near ? 26 + Math.random() * 44 : 7 + Math.random() * 18),
      a: near ? 0.30 + Math.random() * 0.25 : 0.45 + Math.random() * 0.4,
      c: PALETTE[(Math.random() * PALETTE.length) | 0],
      p: Math.random() * Math.PI * 2,
      s: 0.4 + Math.random() * 1.2,
      d: near ? 1 : 0.45,   // 揺れの効き具合（近いものほど大きく動く）
    });
  }
}

function hexToRgb(h) {
  return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
}

function drawScene(g, w, h, t) {
  const sky = g.createLinearGradient(0, 0, 0, h);
  sky.addColorStop(0.00, "#060912");
  sky.addColorStop(0.45, "#0d1424");
  sky.addColorStop(0.72, "#1a1b2c");
  sky.addColorStop(1.00, "#2b1e23");
  g.fillStyle = sky;
  g.fillRect(0, 0, w, h);

  // 地平のにじみ
  const glow = g.createLinearGradient(0, h * 0.55, 0, h);
  glow.addColorStop(0, "rgba(255,150,90,0)");
  glow.addColorStop(1, "rgba(255,150,90,0.16)");
  g.fillStyle = glow;
  g.fillRect(0, h * 0.55, w, h * 0.45);

  g.globalCompositeOperation = "lighter";
  const dx = Math.sin(t * 0.00013) * CFG.DRIFT;
  const dy = Math.cos(t * 0.00009) * CFG.DRIFT * 0.5;
  for (const L of lights) {
    const tw = 1 - CFG.TWINKLE + CFG.TWINKLE * (0.5 + 0.5 * Math.sin(t * 0.001 * L.s + L.p));
    const x = L.x * w + dx * L.d * (w / W);
    const y = L.y * h + dy * L.d * (h / H);
    const r = L.r * (w / W);
    const [cr, cg, cb] = hexToRgb(L.c);
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0.0, `rgba(${cr},${cg},${cb},${L.a * tw})`);
    rg.addColorStop(0.35, `rgba(${cr},${cg},${cb},${L.a * tw * 0.35})`);
    rg.addColorStop(1.0, `rgba(${cr},${cg},${cb},0)`);
    g.fillStyle = rg;
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }
  g.globalCompositeOperation = "source-over";
}

/* ------------------------------ 水滴 ------------------------------ */

function spawnSmalls() {
  for (let i = 0; i < CFG.SMALL_SPAWN; i++) {
    smalls.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: 0.6 + Math.pow(Math.random(), 2.2) * 2.4,
    });
  }
  while (smalls.length > CFG.SMALL_MAX) smalls.shift();
}

function spawnBig() {
  bigs.push({
    x: Math.random() * W,
    y: -20 + Math.random() * H * 0.5,
    r: 2.6 + Math.random() * 2.0,
    vx: 0, vy: 0,
    px: 0, py: 0,
  });
}

function updateDrops() {
  for (let i = bigs.length - 1; i >= 0; i--) {
    const d = bigs[i];
    d.px = d.x; d.py = d.y;

    // 周りの細かい水滴を吸って育つ
    for (let j = smalls.length - 1; j >= 0; j--) {
      const s = smalls[j];
      const dx = s.x - d.x, dy = s.y - d.y;
      if (dx * dx + dy * dy < (d.r + s.r) * (d.r + s.r)) {
        d.r = Math.sqrt(d.r * d.r + s.r * s.r);
        smalls.splice(j, 1);
      }
    }

    if (d.r > CFG.SLIDE_R) {
      d.vy += CFG.GRAVITY * (d.r / 6);
      d.vy *= CFG.FRICTION;
      d.vx += (Math.random() - 0.5) * CFG.WOBBLE;
      d.vx *= 0.86;
      if (Math.random() < CFG.CATCH) { d.vy *= 0.2; d.vx *= 0.2; }  // 引っかかる
      d.x += d.vx;
      d.y += d.vy;

      // 通ったあとに水滴を残す＝痩せる
      const moved = Math.hypot(d.x - d.px, d.y - d.py);
      if (moved > d.r * 0.9) {
        smalls.push({ x: d.px, y: d.py, r: Math.max(0.7, d.r * 0.26) });
        d.r *= 0.985;
        if (smalls.length > CFG.SMALL_MAX) smalls.shift();
      }
      // 曇りを拭う
      if (CFG.FOG > 0) {
        fogC.globalCompositeOperation = "destination-out";
        fogC.lineCap = "round";
        fogC.lineWidth = (d.r * 2.1) / 3;
        fogC.strokeStyle = "#000";
        fogC.beginPath();
        fogC.moveTo(d.px / 3, d.py / 3);
        fogC.lineTo(d.x / 3, d.y / 3);
        fogC.stroke();
        fogC.globalCompositeOperation = "source-over";
      }
    } else {
      d.r += 0.006;
    }

    if (d.y - d.r > H + 20 || d.r < 1) bigs.splice(i, 1);
  }
}

function drawDrops() {
  dropC.setTransform(1, 0, 0, 1, 0, 0);
  dropC.globalCompositeOperation = "source-over";
  dropC.clearRect(0, 0, W, H);
  dropC.fillStyle = "#fff";

  dropC.beginPath();
  for (const s of smalls) {
    dropC.moveTo(s.x + s.r, s.y);
    dropC.arc(s.x, s.y, s.r, 0, Math.PI * 2);
  }
  dropC.fill();

  // 大粒は少し縦長にして、尾を引かせる
  for (const d of bigs) {
    const stretch = Math.min(1.8, 1 + Math.abs(d.vy) * 0.05);
    dropC.save();
    dropC.translate(d.x, d.y);
    dropC.scale(1, stretch);
    dropC.beginPath();
    dropC.arc(0, 0, d.r, 0, Math.PI * 2);
    dropC.fill();
    dropC.restore();
  }

  // 水滴の形で切り抜いて、中に「くっきりした景色」を映す
  dropC.globalCompositeOperation = "source-in";
  dropC.save();
  dropC.translate(W / 2, H / 2);
  dropC.scale(CFG.REFRACT, CFG.FLIP ? -CFG.REFRACT : CFG.REFRACT);
  dropC.drawImage(sharp, -W / 2, -H / 2, W, H);
  dropC.restore();
  dropC.globalCompositeOperation = "source-over";
}

/* ------------------------------ ループ ------------------------------ */

let last = 0;

function frame(t) {
  requestAnimationFrame(frame);
  if (t - last < 16) return;
  last = t;

  drawScene(sharpC, W, H, t);
  drawScene(blurC, blur.width, blur.height, t);

  if (CFG.FOG > 0) {
    fogC.fillStyle = `rgba(214,226,240,${CFG.FOG_RECOVER})`;
    fogC.fillRect(0, 0, fog.width, fog.height);
  }

  spawnSmalls();
  if (Math.random() < CFG.BIG_SPAWN) spawnBig();
  updateDrops();
  drawDrops();

  // 1. ガラス越しのぼけた景色
  ctx.globalCompositeOperation = "source-over";
  ctx.globalAlpha = 1;
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(blur, 0, 0, W, H);

  // 2. 曇り
  if (CFG.FOG > 0) {
    ctx.globalAlpha = CFG.FOG;
    ctx.drawImage(fog, 0, 0, W, H);
    ctx.globalAlpha = 1;
  }

  // 3. 水滴
  ctx.drawImage(drop, 0, 0, W, H);

  // 4. つや
  if (CFG.SHINE > 0) {
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = CFG.SHINE;
    ctx.drawImage(drop, 0, 0, W, H);
    ctx.globalAlpha = 1;
    for (const d of bigs) {
      if (d.r < 3) continue;
      const hx = d.x - d.r * 0.32, hy = d.y - d.r * 0.42, hr = d.r * 0.5;
      const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, hr);
      hg.addColorStop(0, `rgba(255,255,255,${0.5 * CFG.SHINE * 4})`);
      hg.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = hg;
      ctx.beginPath();
      ctx.arc(hx, hy, hr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";
  }

  // 5. 周辺減光
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
}

window.addEventListener("resize", resize);
resize();

if (reduced) {
  // 動きを減らす設定のときは、雨粒が付いた静止画として一度だけ描く
  CFG.TWINKLE = 0; CFG.DRIFT = 0;
  for (let i = 0; i < 60; i++) spawnSmalls();
  drawScene(sharpC, W, H, 0);
  drawScene(blurC, blur.width, blur.height, 0);
  drawDrops();
  ctx.drawImage(blur, 0, 0, W, H);
  ctx.drawImage(drop, 0, 0, W, H);
  ctx.fillStyle = vignette;
  ctx.fillRect(0, 0, W, H);
} else {
  requestAnimationFrame(frame);
}
</script>
<script>
"use strict";

/* ------------------------------------------------------------------
   音の再生とミュート切り替え。上のアニメーション本体には触れない。
------------------------------------------------------------------ */
(function () {
  const overlay  = document.getElementById("overlay");
  const bgm      = document.getElementById("bgm");
  const muteBtn  = document.getElementById("mute-btn");

  overlay.addEventListener("click", () => {
    overlay.remove();
    bgm.play();
  }, { once: true });

  muteBtn.addEventListener("click", () => {
    bgm.muted = !bgm.muted;
    muteBtn.textContent = bgm.muted ? "音を鳴らす" : "音を止める";
  });
})();
</script>
</body>
</html>
