    margin: 10px 0;

  }

  }
  .piano-roll-note {

  }
  .piano-roll-note-clickable {
    cursor: pointer;
  }
  .piano-roll-note-selected {
    fill: #e08a2e;
  }
  .piano-roll-note-diff {
    fill: #e08a2e;
  }
  .piano-roll-note-playing {
    fill: #2fb380;
  }
  .piano-roll-playhead {
    stroke: #e0503e;
    stroke-width: 1.5;
    pointer-events: none;
  }
  .piano-roll-wrap-small .piano-roll-label {
    font-size: 7px;
  }
  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid #8884;
    font-size: 0.8125rem;
    opacity: 0.75;
  }
  footer a {
    color: #4a90d9;
    text-decoration: none;
  }
  footer a:hover,
  footer a:focus-visible {
    text-decoration: underline;
  }
</style>

<div class="error" id="errorMsg"></div>

<div class="transport">
  <button id="playBtn">▶ 再生</button>
  <button id="stopBtn">■ 停止</button>
</div>

<div id="nowPlaying">停止中</div>
<div id="noteChips"></div>

<div class="editor">
  <label for="bpmInput">BPM(任意): <input type="number" id="bpmInput" min="40" max="240" style="width:5em;"></label>
  <span class="hint">指定すると、下の表示に小節線が入り、←→キーでの長さ変更(16分音符単位)が使えます</span>
</div>
<div class="piano-roll-wrap" id="pianoRollWrap"></div>

<div class="editor">
  <button id="upBtn" type="button" title="半音上げる (↑キー)" disabled>▲ 半音上げる</button>
  <button id="downBtn" type="button" title="半音下げる (↓キー)" disabled>▼ 半音下げる</button>
  <button id="shortenBtn" type="button" title="16分音符ぶん短くする (←キー)" disabled>◀ 短くする(16分)</button>
  <button id="lengthenBtn" type="button" title="16分音符ぶん長くする (→キー)" disabled>▶ 長くする(16分)</button>
  <span id="selectionInfo" class="hint">音符をクリックすると選べます</span>
</div>
<div class="editor">
  <span id="durationHint" class="hint"></span>
</div>

<script>
(function () {
  "use strict";

  // ---- 音の設定 ----------------------------------------------------
  const PEAK_GAIN = 0.15;   // 控えめな音量(1声のみなのでchordより少し大きめ)
  const FADE_TIME = 0.03;   // 各音のフェードイン/フェードアウトの上限(秒)

  // ---- Web Audio ----------------------------------------------------
  let audioCtx = null;
  let isPlaying = false;
  let timers = [];   // setTimeoutのID一覧(停止時にまとめてクリアする)

  function midiToFreq(midi) {
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  // following-wind-site/chords/index.html の playNote と同じ作り方
  function playNote(ctx, freq, startTime, duration, peakGain) {
    const osc = ctx.createOscillator();
    osc.type = "triangle";
    osc.frequency.value = freq;

    const gain = ctx.createGain();
    const fade = Math.min(FADE_TIME, duration / 4);
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(peakGain, startTime + fade);
    gain.gain.setValueAtTime(peakGain, startTime + duration - fade);
    gain.gain.linearRampToValueAtTime(0, startTime + duration);

    osc.connect(gain).connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  }

  // ---- JSON読み込み ----------------------------------------------------
  function parseNotes(text) {
    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      throw new Error("JSONの形式が正しくありません: " + e.message);
    }
    if (!Array.isArray(data)) {
      throw new Error("JSONは配列である必要があります([{...}, {...}])");
    }
    if (data.length === 0) {
      throw new Error("音符が1つもありません");
    }
    data.forEach((n, i) => {
      if (typeof n.midi !== "number" || typeof n.start !== "number" || typeof n.duration !== "number") {
        throw new Error(`${i + 1}番目の要素に midi/start/duration が数値で揃っていません`);
      }
    });
    return data;
  }

  // ---- UI ----------------------------------------------------
  const jsonInputEl = document.getElementById("jsonInput");
  const errorMsgEl = document.getElementById("errorMsg");
  const nowPlayingEl = document.getElementById("nowPlaying");
  const noteChipsEl = document.getElementById("noteChips");
  const playBtn = document.getElementById("playBtn");
  const stopBtn = document.getElementById("stopBtn");
  const upBtn = document.getElementById("upBtn");
  const downBtn = document.getElementById("downBtn");
  const shortenBtn = document.getElementById("shortenBtn");
  const lengthenBtn = document.getElementById("lengthenBtn");
  const durationHintEl = document.getElementById("durationHint");
  const selectionInfoEl = document.getElementById("selectionInfo");
  const bpmInputEl = document.getElementById("bpmInput");
  const pianoRollWrapEl = document.getElementById("pianoRollWrap");

  let notes = [];          // 今テキストエリアに入っている音符(startの昇順)
  let selectedIndex = -1;  // 選択中の音符の位置(-1は未選択)
  let pianoRollRange = { min: 48, max: 72 }; // メロディを読み直すたびに計算し直す(候補内では固定)

  // 単音の試し聞き用。再生用のaudioCtxは停止時にcloseするので別にしておく
  let previewCtx = null;

  function previewNote(midi) {
    if (!previewCtx) {
      previewCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (previewCtx.state === "suspended") {
      previewCtx.resume();
    }
    playNote(previewCtx, midiToFreq(midi), previewCtx.currentTime + 0.01, 0.35, PEAK_GAIN);
  }

  function renderChips() {
    noteChipsEl.innerHTML = "";
    notes.forEach((n, i) => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "note-chip";
      chip.dataset.index = String(i);
      chip.textContent = n.note || `midi ${n.midi}`;
      noteChipsEl.appendChild(chip);
    });
    updateSelectionUI();
  }

  function currentHummingBpm() {
    const v = Number(bpmInputEl.value);
    return v > 0 ? v : null;
  }

  function renderPianoRoll() {
    pianoRollWrapEl.innerHTML = "";
    if (!notes.length) return;
    const svg = buildPianoRoll(notes, pianoRollRange, {
      bpm: currentHummingBpm(),
      selectedIndex,
      onNoteClick: selectNote,
    });
    pianoRollWrapEl.appendChild(svg);
  }

  function updateSelectionUI() {
    noteChipsEl.querySelectorAll(".note-chip").forEach((el, i) => {
      el.classList.toggle("selected", i === selectedIndex);
    });
    const hasSelection = selectedIndex >= 0 && selectedIndex < notes.length;
    upBtn.disabled = !hasSelection;
    downBtn.disabled = !hasSelection;
    if (hasSelection) {
      const n = notes[selectedIndex];
      selectionInfoEl.textContent =
        `選択中: ${selectedIndex + 1}番目 ${n.note || ""} (midi ${n.midi}) ／ ↑↓キーでも変えられます`;
    } else {
      selectionInfoEl.textContent = "音符をクリックすると選べます";
    }
    updateDurationButtons();
    renderPianoRoll();
  }

  // 長さ変更(shiftDuration)が今できるかどうかを判定する。
  // direction: +1=長くする(次の音符を短くして吸収)、-1=短くする(次の音符を長くする)
  function checkDurationShift(direction) {
    if (selectedIndex < 0 || selectedIndex >= notes.length) {
      return { ok: false, reason: "" };
    }
    if (selectedIndex >= notes.length - 1) {
      return { ok: false, reason: "最後の音符は長さ変更の対象外です" };
    }
    const step = sixteenthDuration();
    if (!step) {
      return { ok: false, reason: "BPMを入れると使えます" };
    }
    const cur = notes[selectedIndex];
    const next = notes[selectedIndex + 1];
    const delta = direction * step;
    const newCurDuration = cur.duration + delta;
    const newNextDuration = next.duration - delta;
    const minDuration = step - 1e-9; // 浮動小数の誤差を吸収する分だけ緩める

    if (newCurDuration < minDuration) {
      return { ok: false, reason: "これ以上短くできません" };
    }
    if (newNextDuration < minDuration) {
      return { ok: false, reason: "次の音符が短すぎて吸収しきれません" };
    }
    return { ok: true, reason: "" };
  }

  function updateDurationButtons() {
    const shorten = checkDurationShift(-1);
    const lengthen = checkDurationShift(1);
    shortenBtn.disabled = !shorten.ok;
    lengthenBtn.disabled = !lengthen.ok;

    if (selectedIndex < 0) {
      durationHintEl.textContent = "";
      return;
    }
    const reasons = [];
    if (!shorten.ok && shorten.reason) reasons.push("◀ " + shorten.reason);
    if (!lengthen.ok && lengthen.reason) reasons.push("▶ " + lengthen.reason);
    // 短くする/長くするが同じ理由でどちらも無効なときは、まとめて1つだけ出す
    if (reasons.length === 2 && shorten.reason === lengthen.reason) {
      durationHintEl.textContent = shorten.reason;
    } else if (reasons.length > 0) {
      durationHintEl.textContent = reasons.join(" ／ ");
    } else {
      durationHintEl.textContent = "←→キーでも16分音符単位の長さ変更ができます";
    }
  }

  function selectNote(index) {
    if (index < 0 || index >= notes.length) return;
    selectedIndex = index;
    updateSelectionUI();
    previewNote(notes[index].midi);
  }

  // テキストエリアのJSONを読み直してチップを表示し直す
  function reloadNotes() {
    let parsed;
    try {
      parsed = parseNotes(jsonInputEl.value);
    } catch (e) {
      errorMsgEl.textContent = e.message;
      notes = [];
      selectedIndex = -1;
      noteChipsEl.innerHTML = "";
      updateSelectionUI();
      return false;
    }
    errorMsgEl.textContent = "";
    notes = parsed.slice().sort((a, b) => a.start - b.start);
    pianoRollRange = computePianoRollRange(notes); // 元のメロディの音域で固定する
    if (selectedIndex >= notes.length) selectedIndex = -1;
    renderChips();
    return true;
  }

  // ---- 音の高さを直す ----------------------------------------------------
  const NOTE_NAMES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];

  function midiToName(midi) {
    return NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1);
  }

  // ---- ピアノロール表示 ----------------------------------------------------
  // following-wind-site/melody/index.html にも同じ内容をコピーしてある。
  // 直したときは両方に反映すること
  const PIANO_ROLL_ROW_HEIGHT = 12;    // 半音1つぶんの高さ(px)
  const PIANO_ROLL_LABEL_WIDTH = 32;   // 左端の音名ラベルの幅(px)
  const PIANO_ROLL_PX_PER_SEC = 90;    // 横方向、1秒あたりのpx
  const PIANO_ROLL_PADDING_SEC = 0.3;  // 右端の余白(秒)
  const PIANO_ROLL_MARGIN_SEMITONES = 2; // 音域の上下に足す余白(半音)

  function isBlackKeyMidi(midi) {
    return [1, 3, 6, 8, 10].includes(((midi % 12) + 12) % 12);
  }

  const PIANO_ROLL_WHITE_KEY_OFFSETS = [0, 2, 4, 5, 7, 9, 11]; // C D E F G A B
  const PIANO_ROLL_MIN_LABEL_ROW_HEIGHT = 9; // これよりrowHeightが小さいときはCの位置だけに間引く

  function isWhiteKeyMidi(midi) {
    return PIANO_ROLL_WHITE_KEY_OFFSETS.includes(((midi % 12) + 12) % 12);
  }

  // メロディに出てくる音の範囲+上下の余白。候補を切り替えても範囲がぶれないよう、
  // 呼び出し側でメロディを読み直したタイミングだけで計算し、以降は使い回すこと
  function computePianoRollRange(rangeNotes, margin) {
    margin = margin == null ? PIANO_ROLL_MARGIN_SEMITONES : margin;
    const midis = rangeNotes.map((n) => n.midi);
    return {
      min: Math.max(0, Math.min(...midis) - margin),
      max: Math.min(127, Math.max(...midis) + margin),
    };
  }

  // rollNotes: 描画する音符の配列
  // range: {min, max}(computePianoRollRangeで求めた、固定して使う音域)
  // opts: bpm / rowHeight / pxPerSec / labelWidth / selectedIndex / diffIndices(Set) / onNoteClick
  function buildPianoRoll(rollNotes, range, opts) {
    opts = opts || {};
    const rowHeight = opts.rowHeight || PIANO_ROLL_ROW_HEIGHT;
    const pxPerSec = opts.pxPerSec || PIANO_ROLL_PX_PER_SEC;
    const labelWidth = opts.labelWidth == null ? PIANO_ROLL_LABEL_WIDTH : opts.labelWidth;
    const bpm = opts.bpm || null;

    const svgNS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("class", "piano-roll");

    if (!rollNotes || rollNotes.length === 0) {
      svg.setAttribute("width", 0);
      svg.setAttribute("height", 0);
      return svg;
    }

    const lastEnd = rollNotes.reduce((m, n) => Math.max(m, n.start + n.duration), 0);
    const spanSec = lastEnd + PIANO_ROLL_PADDING_SEC;
    const rows = range.max - range.min + 1;
    const width = labelWidth + spanSec * pxPerSec;
    const height = rows * rowHeight;

    svg.setAttribute("width", width);
    svg.setAttribute("height", height);
    svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

    const yFor = (midi) => (range.max - midi) * rowHeight;
    const xFor = (t) => labelWidth + t * pxPerSec;

    // rowHeightに余裕があれば白鍵(C D E F G A B)全部にラベルを出す。
    // 潰れそうな細さのときはCの位置だけに間引く
    const labelAllWhiteKeys = rowHeight >= PIANO_ROLL_MIN_LABEL_ROW_HEIGHT;

    // 音域の背景(白鍵/黒鍵の帯) + 音名ラベル
    for (let m = range.min; m <= range.max; m++) {
      const row = document.createElementNS(svgNS, "rect");
      row.setAttribute("x", 0);
      row.setAttribute("y", yFor(m));
      row.setAttribute("width", width);
      row.setAttribute("height", rowHeight);
      row.setAttribute(
        "class",
        "piano-roll-row " + (isBlackKeyMidi(m) ? "piano-roll-row-black" : "piano-roll-row-white")
      );
      svg.appendChild(row);

      const shouldLabel = labelAllWhiteKeys ? isWhiteKeyMidi(m) : m % 12 === 0;
      if (shouldLabel) {
        const label = document.createElementNS(svgNS, "text");
        label.setAttribute("x", labelWidth - 4);
        label.setAttribute("y", yFor(m) + rowHeight - rowHeight * 0.25);
        label.setAttribute("class", "piano-roll-label");
        label.textContent = midiToName(m);
        svg.appendChild(label);
      }
    }

    // 拍・小節の区切り線(BPM指定時のみ。4/4拍子として扱う)
    if (bpm) {
      const beatDur = 60 / bpm;
      const beatCount = Math.floor(spanSec / beatDur) + 1;
      for (let b = 0; b <= beatCount; b++) {
        const t = b * beatDur;
        if (t > spanSec) break;
        const x = xFor(t);
        const line = document.createElementNS(svgNS, "line");
        line.setAttribute("x1", x);
        line.setAttribute("x2", x);
        line.setAttribute("y1", 0);
        line.setAttribute("y2", height);
        line.setAttribute("class", b % 4 === 0 ? "piano-roll-bar-line" : "piano-roll-beat-line");
        svg.appendChild(line);
      }
    }

    // 音符ブロック
    rollNotes.forEach((n, i) => {
      const rect = document.createElementNS(svgNS, "rect");
      rect.setAttribute("x", xFor(n.start) + 1);
      rect.setAttribute("y", yFor(n.midi) + 1);
      rect.setAttribute("width", Math.max(2, n.duration * pxPerSec - 2));
      rect.setAttribute("height", Math.max(2, rowHeight - 2));
      rect.setAttribute("rx", 2);
      rect.dataset.index = String(i);

      let cls = "piano-roll-note";
      if (opts.diffIndices && opts.diffIndices.has(i)) cls += " piano-roll-note-diff";
      if (opts.selectedIndex === i) cls += " piano-roll-note-selected";
      rect.setAttribute("class", cls);

      if (opts.onNoteClick) {
        rect.classList.add("piano-roll-note-clickable");
        rect.addEventListener("click", () => opts.onNoteClick(i));
      }
      svg.appendChild(rect);
    });

    return svg;
  }

  // 選択中の音符を半音単位で上下させる(長さ start / duration は触らない)
  function shiftSelected(semitones) {
    if (selectedIndex < 0 || selectedIndex >= notes.length) return;
    const note = notes[selectedIndex];
    const newMidi = note.midi + semitones;
    if (newMidi < 0 || newMidi > 127) return; // MIDIの範囲外には行かない

    note.midi = newMidi;
    note.note = midiToName(newMidi);

    const chip = noteChipsEl.querySelectorAll(".note-chip")[selectedIndex];
    if (chip) chip.textContent = note.note;
    updateSelectionUI();
    writeBackJson();
    previewNote(newMidi);
  }

  function round3(x) {
    return Math.round(x * 1000) / 1000;
  }

  // 16分音符1つぶんの秒数。BPM未指定ならnull(長さ変更は無効)
  function sixteenthDuration() {
    const bpm = currentHummingBpm();
    return bpm ? (60 / bpm) / 4 : null;
  }

  // 選択中の音符の長さを16分音符単位で変える(startはどの音符も動かさない)。
  // 増やした分は次の音符の長さから、減らした分は次の音符の長さに、そのまま移す
  function shiftDuration(direction) {
    const check = checkDurationShift(direction);
    if (!check.ok) return;

    const step = sixteenthDuration();
    const cur = notes[selectedIndex];
    const next = notes[selectedIndex + 1];
    const delta = direction * step;

    cur.duration = round3(cur.duration + delta);
    next.duration = round3(next.duration - delta);

    writeBackJson();
    updateDurationButtons();
    renderPianoRoll();
  }

  // 直した結果をテキストエリアのJSONに書き戻す
  // (inputイベントで選択が外れないよう、書き戻し中はハンドラを黙らせる)
  let writingBack = false;
  function writeBackJson() {
    writingBack = true;
    jsonInputEl.value = JSON.stringify(notes, null, 2);
    writingBack = false;
  }

  upBtn.addEventListener("click", () => shiftSelected(1));
  downBtn.addEventListener("click", () => shiftSelected(-1));
  shortenBtn.addEventListener("click", () => shiftDuration(-1));
  lengthenBtn.addEventListener("click", () => shiftDuration(1));

  bpmInputEl.addEventListener("input", () => {
    updateSelectionUI(); // ヒント文の更新も兼ねて呼ぶ(中でrenderPianoRollも走る)
  });

  // 上下矢印キー = 音の高さ、左右矢印キー = 音の長さ
  document.addEventListener("keydown", (e) => {
    if (e.target === jsonInputEl) return;          // JSONを編集中は普通の矢印キー
    if (selectedIndex < 0) return;
    if (e.key === "ArrowUp" || e.key === "ArrowDown") {
      e.preventDefault();                          // ページのスクロールを止める
      shiftSelected(e.key === "ArrowUp" ? 1 : -1);
    } else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      e.preventDefault();
      shiftDuration(e.key === "ArrowRight" ? 1 : -1);
    }
  });

  noteChipsEl.addEventListener("click", (e) => {
    const chip = e.target.closest(".note-chip");
    if (!chip) return;
    selectNote(Number(chip.dataset.index));
  });

  // ユーザーがJSONを直接書き換えたら、チップも作り直す
  jsonInputEl.addEventListener("input", () => {
    if (writingBack) return;
    selectedIndex = -1;
    reloadNotes();
  });

  function clearTimers() {
    timers.forEach((id) => clearTimeout(id));
    timers = [];
  }

  // ---- ピアノロールへの再生位置の表示 ----------------------------------------------------
  let playheadRafId = null;

  function currentPianoRollSvg() {
    return pianoRollWrapEl.querySelector("svg.piano-roll");
  }

  function ensurePlayheadLine(svg) {
    let line = svg.querySelector(".piano-roll-playhead");
    if (!line) {
      line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("class", "piano-roll-playhead");
      line.setAttribute("y1", 0);
      line.setAttribute("y2", svg.getAttribute("height"));
      svg.appendChild(line);
    }
    return line;
  }

  function setPlayheadTime(t) {
    const svg = currentPianoRollSvg();
    if (!svg) return;
    const x = PIANO_ROLL_LABEL_WIDTH + t * PIANO_ROLL_PX_PER_SEC;
    const line = ensurePlayheadLine(svg);
    line.setAttribute("x1", x);
    line.setAttribute("x2", x);
  }

  function clearPlayhead() {
    const svg = currentPianoRollSvg();
    if (!svg) return;
    const line = svg.querySelector(".piano-roll-playhead");
    if (line) line.remove();
  }

  function startPlayheadAnimation(baseTime, totalDurationSec) {
    function tick() {
      if (!audioCtx) return; // 再生が止まっていたら追いかけない
      const elapsed = audioCtx.currentTime - baseTime;
      if (elapsed < 0) {
        playheadRafId = requestAnimationFrame(tick);
        return;
      }
      if (elapsed > totalDurationSec) {
        clearPlayhead();
        playheadRafId = null;
        return;
      }
      setPlayheadTime(elapsed);
      playheadRafId = requestAnimationFrame(tick);
    }
    playheadRafId = requestAnimationFrame(tick);
  }

  function stopPlayheadAnimation() {
    if (playheadRafId) {
      cancelAnimationFrame(playheadRafId);
      playheadRafId = null;
    }
    clearPlayhead();
    pianoRollWrapEl.querySelectorAll(".piano-roll-note-playing").forEach((el) => {
      el.classList.remove("piano-roll-note-playing");
    });
  }

  function resetToStopped() {
    isPlaying = false;
    nowPlayingEl.textContent = "停止中";
    document.querySelectorAll(".note-chip").forEach((el) => el.classList.remove("playing"));
    stopPlayheadAnimation();
  }

  function stopPlayback() {
    clearTimers();
    if (audioCtx) {
      // contextを閉じるとスケジュール済みの音も含めて即座に止まる
      audioCtx.close();
      audioCtx = null;
    }
    resetToStopped();
  }

  function startPlayback() {
    if (!reloadNotes()) return;

    stopPlayback(); // 念のため前の再生を止めてからやり直す

    const chipEls = noteChipsEl.querySelectorAll(".note-chip");

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    isPlaying = true;

    const baseTime = audioCtx.currentTime + 0.05;

    notes.forEach((note, i) => {
      const freq = midiToFreq(note.midi);
      playNote(audioCtx, freq, baseTime + note.start, note.duration, PEAK_GAIN);

      const startDelayMs = note.start * 1000;
      timers.push(setTimeout(() => {
        nowPlayingEl.textContent = `♪ ${note.note || note.midi} (${i + 1} / ${notes.length})`;
        chipEls.forEach((el, j) => el.classList.toggle("playing", j === i));
        const rollNoteEls = pianoRollWrapEl.querySelectorAll(".piano-roll-note");
        rollNoteEls.forEach((el, j) => el.classList.toggle("piano-roll-note-playing", j === i));
      }, startDelayMs));
    });

    const lastNote = notes[notes.length - 1];
    const totalDurationSec = lastNote.start + lastNote.duration;
    const totalMs = totalDurationSec * 1000;
    timers.push(setTimeout(() => {
      resetToStopped();
    }, totalMs + 50));

    startPlayheadAnimation(baseTime, totalDurationSec);
  }

  playBtn.addEventListener("click", startPlayback);
  stopBtn.addEventListener("click", stopPlayback);

  reloadNotes(); // ページを開いた時点でチップを出しておく
})();
</script>
