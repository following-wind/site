  }
  .note-chip {
    border: 1px solid #8886;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 0.8em;
    opacity: 0.6;
    font-family: inherit;
    color: inherit;
    background: transparent;
    cursor: pointer;

  .note-chip:hover {
    opacity: 0.9;
  }
  .note-chip.playing {
    border-color: #4a90d9;
    box-shadow: 0 0 0 2px #4a90d955;
    opacity: 1;
    font-weight: bold;
  }
  .note-chip.selected {
    border-color: #e08a2e;
    box-shadow: 0 0 0 2px #e08a2e55;
    opacity: 1;
    font-weight: bold;
  }
  .editor {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 12px;
  }
  .editor button {
    font-size: 1em;
    padding: 6px 14px;
    cursor: pointer;
  }
  .editor button:disabled {
    opacity: 0.4;
    cursor: default;
  }
  #selectionInfo {
    font-size: 0.9em;
  }
  footer {
    margin-top: 3rem;
    padding-top: 1.5rem;
    border-top: 1px solid #8884;
    font-size: 0.8125rem;
    opacity: 0.75;
  }
  footer a {
    color: #4a90d9;
    text-decoration: none;
  }
  footer a:hover,
  footer a:focus-visible {
    text-decoration: underline;
  }
</style>

<div class="error" id="errorMsg"></div>

<div class="transport">
  <button id="playBtn">▶ 再生</button>
  <button id="stopBtn">■ 停止</button>
</div>

<div id="nowPlaying">停止中</div>
<div id="noteChips"></div>

<div class="editor">
  <button id="upBtn" type="button" title="半音上げる (↑キー)" disabled>▲ 半音上げる</button>
  <button id="downBtn" type="button" title="半音下げる (↓キー)" disabled>▼ 半音下げる</button>
  <span id="selectionInfo" class="hint">音符をクリックすると選べます</span>
</div>

<script>
(function () {
  "use strict";

  // ---- 音の設定 ----------------------------------------------------
  const PEAK_GAIN = 0.15;   // 控えめな音量(1声のみなのでchordより少し大きめ)
  const FADE_TIME = 0.03;   // 各音のフェードイン/フェードアウトの上限(秒)

  // ---- Web Audio ----------------------------------------------------
  let audioCtx = null;
  let isPlaying = false;
  let timers = [];   // setTimeoutのID一覧(停止時にまとめてクリアする)

  function midiToFreq(midi) {
    return 440 * Math.pow(2, (midi - 69) / 12);
  }

  // following-wind-site/chords/index.html の playNote と同じ作り方
  function playNote(ctx, freq, startTime, duration, peakGain) {
    const osc = ctx.createOscillator();
    osc.type = "triangle";
    osc.frequency.value = freq;

    const gain = ctx.createGain();
    const fade = Math.min(FADE_TIME, duration / 4);
    gain.gain.setValueAtTime(0, startTime);
    gain.gain.linearRampToValueAtTime(peakGain, startTime + fade);
    gain.gain.setValueAtTime(peakGain, startTime + duration - fade);
    gain.gain.linearRampToValueAtTime(0, startTime + duration);

    osc.connect(gain).connect(ctx.destination);
    osc.start(startTime);
    osc.stop(startTime + duration + 0.02);
  }

  // ---- JSON読み込み ----------------------------------------------------
  function parseNotes(text) {
    let data;
    try {
      data = JSON.parse(text);
    } catch (e) {
      throw new Error("JSONの形式が正しくありません: " + e.message);
    }
    if (!Array.isArray(data)) {
      throw new Error("JSONは配列である必要があります([{...}, {...}])");
    }
    if (data.length === 0) {
      throw new Error("音符が1つもありません");
    }
    data.forEach((n, i) => {
      if (typeof n.midi !== "number" || typeof n.start !== "number" || typeof n.duration !== "number") {
        throw new Error(`${i + 1}番目の要素に midi/start/duration が数値で揃っていません`);
      }
    });
    return data;
  }

  // ---- UI ----------------------------------------------------
  const jsonInputEl = document.getElementById("jsonInput");
  const errorMsgEl = document.getElementById("errorMsg");
  const nowPlayingEl = document.getElementById("nowPlaying");
  const noteChipsEl = document.getElementById("noteChips");
  const playBtn = document.getElementById("playBtn");
  const stopBtn = document.getElementById("stopBtn");
  const upBtn = document.getElementById("upBtn");
  const downBtn = document.getElementById("downBtn");
  const selectionInfoEl = document.getElementById("selectionInfo");

  let notes = [];          // 今テキストエリアに入っている音符(startの昇順)
  let selectedIndex = -1;  // 選択中の音符の位置(-1は未選択)

  // 単音の試し聞き用。再生用のaudioCtxは停止時にcloseするので別にしておく
  let previewCtx = null;

  function previewNote(midi) {
    if (!previewCtx) {
      previewCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (previewCtx.state === "suspended") {
      previewCtx.resume();
    }
    playNote(previewCtx, midiToFreq(midi), previewCtx.currentTime + 0.01, 0.35, PEAK_GAIN);
  }

  function renderChips() {
    noteChipsEl.innerHTML = "";
    notes.forEach((n, i) => {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = "note-chip";
      chip.dataset.index = String(i);
      chip.textContent = n.note || `midi ${n.midi}`;
      noteChipsEl.appendChild(chip);
    });
    updateSelectionUI();
  }

  function updateSelectionUI() {
    noteChipsEl.querySelectorAll(".note-chip").forEach((el, i) => {
      el.classList.toggle("selected", i === selectedIndex);
    });
    const hasSelection = selectedIndex >= 0 && selectedIndex < notes.length;
    upBtn.disabled = !hasSelection;
    downBtn.disabled = !hasSelection;
    if (hasSelection) {
      const n = notes[selectedIndex];
      selectionInfoEl.textContent =
        `選択中: ${selectedIndex + 1}番目 ${n.note || ""} (midi ${n.midi}) ／ ↑↓キーでも変えられます`;
    } else {
      selectionInfoEl.textContent = "音符をクリックすると選べます";
    }
  }

  function selectNote(index) {
    if (index < 0 || index >= notes.length) return;
    selectedIndex = index;
    updateSelectionUI();
    previewNote(notes[index].midi);
  }

  // テキストエリアのJSONを読み直してチップを表示し直す
  function reloadNotes() {
    let parsed;
    try {
      parsed = parseNotes(jsonInputEl.value);
    } catch (e) {
      errorMsgEl.textContent = e.message;
      notes = [];
      selectedIndex = -1;
      noteChipsEl.innerHTML = "";
      updateSelectionUI();
      return false;
    }
    errorMsgEl.textContent = "";
    notes = parsed.slice().sort((a, b) => a.start - b.start);
    if (selectedIndex >= notes.length) selectedIndex = -1;
    renderChips();
    return true;
  }

  // ---- 音の高さを直す ----------------------------------------------------
  const NOTE_NAMES = ["C", "C♯", "D", "D♯", "E", "F", "F♯", "G", "G♯", "A", "A♯", "B"];

  function midiToName(midi) {
    return NOTE_NAMES[midi % 12] + (Math.floor(midi / 12) - 1);
  }

  // 選択中の音符を半音単位で上下させる(長さ start / duration は触らない)
  function shiftSelected(semitones) {
    if (selectedIndex < 0 || selectedIndex >= notes.length) return;
    const note = notes[selectedIndex];
    const newMidi = note.midi + semitones;
    if (newMidi < 0 || newMidi > 127) return; // MIDIの範囲外には行かない

    note.midi = newMidi;
    note.note = midiToName(newMidi);

    const chip = noteChipsEl.querySelectorAll(".note-chip")[selectedIndex];
    if (chip) chip.textContent = note.note;
    updateSelectionUI();
    writeBackJson();
    previewNote(newMidi);
  }

  // 直した結果をテキストエリアのJSONに書き戻す
  // (inputイベントで選択が外れないよう、書き戻し中はハンドラを黙らせる)
  let writingBack = false;
  function writeBackJson() {
    writingBack = true;
    jsonInputEl.value = JSON.stringify(notes, null, 2);
    writingBack = false;
  }

  upBtn.addEventListener("click", () => shiftSelected(1));
  downBtn.addEventListener("click", () => shiftSelected(-1));

  // 上下矢印キーでも変えられるようにする
  document.addEventListener("keydown", (e) => {
    if (e.target === jsonInputEl) return;          // JSONを編集中は普通の矢印キー
    if (selectedIndex < 0) return;
    if (e.key !== "ArrowUp" && e.key !== "ArrowDown") return;
    e.preventDefault();                            // ページのスクロールを止める
    shiftSelected(e.key === "ArrowUp" ? 1 : -1);
  });

  noteChipsEl.addEventListener("click", (e) => {
    const chip = e.target.closest(".note-chip");
    if (!chip) return;
    selectNote(Number(chip.dataset.index));
  });

  // ユーザーがJSONを直接書き換えたら、チップも作り直す
  jsonInputEl.addEventListener("input", () => {
    if (writingBack) return;
    selectedIndex = -1;
    reloadNotes();
  });

  function clearTimers() {
    timers.forEach((id) => clearTimeout(id));
    timers = [];
  }

  function resetToStopped() {
    isPlaying = false;
    nowPlayingEl.textContent = "停止中";
    document.querySelectorAll(".note-chip").forEach((el) => el.classList.remove("playing"));
  }

  function stopPlayback() {
    clearTimers();
    if (audioCtx) {
      // contextを閉じるとスケジュール済みの音も含めて即座に止まる
      audioCtx.close();
      audioCtx = null;
    }
    resetToStopped();
  }

  function startPlayback() {
    if (!reloadNotes()) return;

    stopPlayback(); // 念のため前の再生を止めてからやり直す

    const chipEls = noteChipsEl.querySelectorAll(".note-chip");

    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    isPlaying = true;

    const baseTime = audioCtx.currentTime + 0.05;

    notes.forEach((note, i) => {
      const freq = midiToFreq(note.midi);
      playNote(audioCtx, freq, baseTime + note.start, note.duration, PEAK_GAIN);

      const startDelayMs = note.start * 1000;
      timers.push(setTimeout(() => {
        nowPlayingEl.textContent = `♪ ${note.note || note.midi} (${i + 1} / ${notes.length})`;
        chipEls.forEach((el, j) => el.classList.toggle("playing", j === i));
      }, startDelayMs));
    });

    const lastNote = notes[notes.length - 1];
    const totalMs = (lastNote.start + lastNote.duration) * 1000;
    timers.push(setTimeout(() => {
      resetToStopped();
    }, totalMs + 50));
  }

  playBtn.addEventListener("click", startPlayback);
  stopBtn.addEventListener("click", stopPlayback);

  reloadNotes(); // ページを開いた時点でチップを出しておく
})();
</script>
