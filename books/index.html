<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>読書 | Following Wind</title>
<style>
  :root {
    --accent: #7B4FBF;
    --ink: #23201e;
    --sub: #6d6763;
    --rule: #e2ddd8;
    --paper: #ffffff;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Meiryo UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
    line-break: strict;
    -webkit-text-size-adjust: 100%;
  }

  .wrap {
    max-width: 40rem;
    margin: 0 auto;
    padding: 0 1.5rem 6rem;
  }

  /* ── ヘッダー ── */
  header {
    padding: 3.5rem 0 2rem;
    border-bottom: 1px solid var(--rule);
    margin-bottom: 3.5rem;
  }

  .kanban {
    font-size: 0.75rem;
    letter-spacing: 0.18em;
    color: var(--sub);
    margin: 0 0 0.6rem;
  }

  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin: 0 0 0.7rem;
    letter-spacing: 0.04em;
  }

  .lead {
    font-size: 0.875rem;
    line-height: 1.9;
    color: var(--sub);
    margin: 0;
  }

  /* ── 感想文 ── */
  article {
    margin-bottom: 5rem;
  }

  .date {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--sub);
    margin: 0 0 0.5rem;
  }

  h2 {
    font-size: 1.25rem;
    line-height: 1.6;
    font-weight: 700;
    margin: 0 0 2rem;
    padding-left: 0.9rem;
    border-left: 4px solid var(--accent);
  }

  article p {
    font-size: 1rem;
    line-height: 2;
    margin: 0 0 1.6rem;
  }

  /* ── 奥付 ── */
  /* 和書の巻末にある奥付にならって、書誌は本文の「あと」に置く */
  .okuduke {
    margin-top: 2.5rem;
    border: 1px solid var(--rule);
    padding: 1.2rem 1.4rem;
  }

  .okuduke dl {
    margin: 0;
    display: grid;
    grid-template-columns: 4.5em 1fr;
    row-gap: 0.55rem;
    font-size: 0.8125rem;
    line-height: 1.7;
  }

  .okuduke dt {
    color: var(--sub);
    letter-spacing: 0.08em;
  }

  .okuduke dd {
    margin: 0;
  }

  .okuduke .honmei {
    font-weight: 700;
    font-size: 0.9375rem;
  }

  /* ── フッター ── */
  footer {
    border-top: 1px solid var(--rule);
    padding-top: 1.5rem;
    font-size: 0.8125rem;
    color: var(--sub);
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
  }

  footer a:hover,
  footer a:focus-visible {
    text-decoration: underline;
  }

  :focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
  }

  .empty {
    color: var(--sub);
    font-size: 0.875rem;
    line-height: 1.9;
  }

  @media (max-width: 480px) {
    .wrap { padding: 0 1.1rem 4rem; }
    header { padding-top: 2.5rem; }
    h2 { font-size: 1.125rem; }
    article p { font-size: 0.9375rem; line-height: 1.95; }
    .okuduke dl { grid-template-columns: 4em 1fr; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="kanban">FOLLOWING WIND</p>
    <h1>読書</h1>
    <p class="lead">読んだ本について、覚えているうちに書いておくところ。</p>
  </header>

  <main id="list"></main>

  <footer>
    <a href="../tips/">操作メモ</a>
  </footer>

</div>

<script src="data/books.js"></script>
<script>
  function render() {
    var list = document.getElementById("list");
    var books = window.BOOKS || [];

    if (books.length === 0) {
      list.innerHTML = '<p class="empty">まだ何も書いていません。</p>';
      return;
    }

    books.forEach(function (b) {
      var article = document.createElement("article");
      if (b.id) article.id = b.id;

      if (b.date) {
        var date = document.createElement("p");
        date.className = "date";
        date.textContent = b.date;
        article.appendChild(date);
      }

      var h2 = document.createElement("h2");
      h2.textContent = b.title;
      article.appendChild(h2);

      (b.body || []).forEach(function (para) {
        var p = document.createElement("p");
        p.textContent = para;
        article.appendChild(p);
      });

      if (b.book) {
        article.appendChild(buildOkuduke(b.book));
      }

      list.appendChild(article);
    });
  }

  function buildOkuduke(info) {
    var box = document.createElement("div");
    box.className = "okuduke";

    var dl = document.createElement("dl");
    var rows = [
      ["書名", info.title, true],
      ["著者", info.author, false],
      ["版元", info.publisher, false]
    ];

    rows.forEach(function (row) {
      if (!row[1]) return;
      var dt = document.createElement("dt");
      dt.textContent = row[0];
      var dd = document.createElement("dd");
      dd.textContent = row[1];
      if (row[2]) dd.className = "honmei";
      dl.appendChild(dt);
      dl.appendChild(dd);
    });

    box.appendChild(dl);
    return box;
  }

  render();
</script>

</body>
</html>
