<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>育成バスケ</title>
<meta name="description" content="架空のバスケリーグを何年も育てる、ブラウザだけで遊べる育成ゲームです。">

<!--
  ============================================================
  進み具合について
  ============================================================
  今はまだ「自チーム」タブしかありません。
  順位表・FA市場・契約更改タブは、後で足す予定です。
  計算そのもの（選手生成・成長・年俸など）はgame.jsにあり、
  ここ（index.html / ui.js）は画面表示だけを担当します。
  ============================================================
-->

<style>
  :root {
    --accent: #7B4FBF;
    --accent-pale: #F2ECFC;
    --bar-track: #EAE7E2;
    --text: #2C2C2A;
    --text-sub: #5F5E5A;
    --border: #D3D1C7;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #ffffff;
    color: var(--text);
    font-family: "Meiryo UI", Meiryo, "Hiragino Kaku Gothic ProN", sans-serif;
  }

  .top-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 16px 20px;
    text-align: center;
  }

  .tab-label {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--text-sub);
    margin: 0 0 2px;
  }

  .team-name {
    font-size: 1.15rem;
    font-weight: bold;
    margin: 0;
  }

  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 60px;
  }

  /* スマホは1人1カードを縦積み。PC幅は左右の余白が目立つので2列にする */
  #roster {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  @media (min-width: 640px) {
    main {
      max-width: 900px;
    }

    #roster {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .player-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    background: #ffffff;
  }

  .player-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 12px;
  }

  .player-name {
    font-size: 1rem;
    font-weight: bold;
    line-break: strict;
  }

  .player-meta {
    flex: 0 0 auto;
    font-size: 0.8rem;
    color: var(--text-sub);
    white-space: nowrap;
  }

  /* 能力5項目。数字は並べず、5本の縦バーで見せる */
  .ability-bars {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }

  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 高さは固定60px。バー自体の高さ(px)はui.js側で40〜99を0〜60pxに
     直接計算して埋め込む（%指定だとネストしたflexの中でラベル分
     目減りして差が見えにくかったため、pxの実寸指定にした） */
  .bar-track {
    width: 100%;
    max-width: 26px;
    height: 60px;
    display: flex;
    align-items: flex-end;
  }

  .bar-fill {
    width: 100%;
    background: var(--bar-track);
    border-radius: 3px 3px 0 0;
  }

  /* その選手の最も高い項目だけ色を変える */
  .bar-fill--top {
    background: var(--accent);
  }

  .bar-label {
    font-size: 0.7rem;
    color: var(--text-sub);
    margin-top: 4px;
  }

  .growth-hint {
    margin-top: 10px;
    text-align: right;
    font-size: 0.75rem;
    color: var(--text-sub);
  }

  .growth-hint .value {
    display: inline-block;
    min-width: 1.4em;
    font-weight: bold;
    color: var(--accent);
  }

  footer {
    max-width: 480px;
    margin: 2rem auto 0;
    padding: 1.5rem 1.5rem 3rem;
    border-top: 1px solid var(--border);
    font-size: 0.8125rem;
    color: var(--text-sub);
    text-align: center;
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
  }

  footer a:hover,
  footer a:focus-visible {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="top-bar">
  <p class="tab-label">自チーム</p>
  <p class="team-name" id="team-name">読み込み中…</p>
</div>

<main>
  <div id="roster"></div>
</main>

<script src="game.js"></script>
<script src="ui.js"></script>

<footer>
  <a href="../">追い風</a>
</footer>

</body>
</html>
