<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>育成バスケ</title>
<meta name="description" content="架空のバスケリーグを何年も育てる、ブラウザだけで遊べる育成ゲームです。">

<!--
  ============================================================
  進み具合について
  ============================================================
  「自チーム」「出場時間」「試合結果」「順位表」「契約更改」「FA市場」の
  6タブが揃いました。
  タブの中身はui.jsのTABS配列で定義していて、
  新しいタブを足すときはそこに{id, label, render}を1つ追加するだけでOK。
  計算そのもの（選手生成・成長・年俸など）はgame.jsにあり、
  ここ（index.html / ui.js）は画面表示だけを担当します。
  ============================================================
-->

<style>
  :root {
    --accent: #7B4FBF;
    --accent-pale: #F2ECFC;
    --bar-track: #EAE7E2;
    --text: #2C2C2A;
    --text-sub: #5F5E5A;
    --border: #D3D1C7;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #ffffff;
    color: var(--text);
    font-family: "Meiryo UI", Meiryo, "Hiragino Kaku Gothic ProN", sans-serif;
  }

  .top-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    text-align: center;
  }

  .app-title {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--text-sub);
    margin: 0 0 10px;
  }

  /* タブ切り替えボタン。tips/index.htmlの.tab-btnと同じ見た目に揃えた */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .tab-btn {
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text-sub);
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
  }

  .tab-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }

  /* シーズン送り。全タブに共通する操作なのでタブの下・top-bar内に固定 */
  .season-bar {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 10px;
  }

  .season-label {
    font-size: 0.8rem;
    color: var(--text-sub);
    white-space: nowrap;
  }

  .season-btn {
    background: var(--accent);
    color: #ffffff;
    border: none;
    border-radius: 16px;
    padding: 7px 16px;
    font-size: 0.8rem;
    font-family: inherit;
    cursor: pointer;
  }

  .season-btn:hover {
    opacity: 0.9;
  }

  .season-btn:disabled {
    background: var(--border);
    color: var(--text-sub);
    cursor: not-allowed;
    opacity: 1;
  }

  .team-name {
    font-size: 1.15rem;
    font-weight: bold;
    margin: 0 0 12px;
  }

  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 60px;
  }

  /* スマホは1人1カードを縦積み。PC幅は左右の余白が目立つので2列にする。
     自チーム・FA市場など、カードを並べるタブで共通に使う。 */
  .card-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  @media (min-width: 640px) {
    main {
      max-width: 900px;
    }

    .card-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .player-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    background: #ffffff;
  }

  .player-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 12px;
  }

  .player-name {
    font-size: 1rem;
    font-weight: bold;
    line-break: strict;
  }

  .player-meta {
    flex: 0 0 auto;
    font-size: 0.8rem;
    color: var(--text-sub);
    white-space: nowrap;
  }

  /* 総合力・年俸のバッジ。tips/index.htmlの.card-keysと同じ見た目に揃えた */
  .player-stats-line {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }

  .stat-chip {
    background: var(--accent-pale);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: bold;
    padding: 4px 8px;
    border-radius: 4px;
  }

  /* 契約更改待ち（残り年数0以下）を目立たせる */
  .stat-chip--pending {
    background: var(--accent);
    color: #ffffff;
  }

  /* 前シーズンの1試合平均成績。バーの直上にコンパクトに1行だけ置く */
  .stats-line {
    font-size: 0.75rem;
    color: var(--text-sub);
    margin-bottom: 8px;
  }

  /* 能力5項目。数字は並べず、5本の縦バーで見せる */
  .ability-bars {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }

  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 高さは固定60px。バー自体の高さ(px)はui.js側で40〜99を0〜60pxに
     直接計算して埋め込む（%指定だとネストしたflexの中でラベル分
     目減りして差が見えにくかったため、pxの実寸指定にした） */
  .bar-track {
    width: 100%;
    max-width: 26px;
    height: 60px;
    display: flex;
    align-items: flex-end;
  }

  .bar-fill {
    width: 100%;
    background: var(--bar-track);
    border-radius: 3px 3px 0 0;
  }

  /* その選手の最も高い項目だけ色を変える */
  .bar-fill--top {
    background: var(--accent);
  }

  .bar-label {
    font-size: 0.7rem;
    color: var(--text-sub);
    margin-top: 4px;
  }

  .growth-hint {
    margin-top: 10px;
    text-align: right;
    font-size: 0.75rem;
    color: var(--text-sub);
  }

  .growth-hint .value {
    display: inline-block;
    min-width: 1.4em;
    font-weight: bold;
    color: var(--accent);
  }

  /* 順位表。4チームだけなので表を横に並べても崩れない */
  .standings {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  .standings th,
  .standings td {
    padding: 10px 8px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  .standings th {
    font-size: 0.75rem;
    font-weight: normal;
    color: var(--text-sub);
  }

  /* 自チームの行だけ強調する */
  .standings-row--mine {
    background: var(--accent-pale);
    font-weight: bold;
  }

  .standings-row--mine td:first-child {
    border-left: 4px solid var(--accent);
    padding-left: 4px;
  }

  /* FA市場: オフシーズン経過を動かすと、下の要求額バッジが値下がりする */
  .fa-controls {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 12px;
  }

  .fa-week-label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-sub);
    margin-bottom: 8px;
  }

  .fa-week-label strong {
    color: var(--accent);
  }

  .fa-week-slider {
    width: 100%;
    accent-color: var(--accent);
  }

  .fa-discount-line {
    font-size: 0.75rem;
    color: var(--text-sub);
    margin-top: -6px;
    margin-bottom: 12px;
  }

  .fa-discount-line .original {
    text-decoration: line-through;
  }

  /* 契約更改タブ */
  .cap-summary {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 16px;
    margin-bottom: 12px;
    font-size: 0.85rem;
    color: var(--text-sub);
  }

  .cap-summary strong {
    color: var(--accent);
  }

  .contracts-empty {
    color: var(--text-sub);
    font-size: 0.875rem;
    text-align: center;
    padding: 40px 16px;
  }

  .contract-decision {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .duration-choice {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
  }

  .duration-btn {
    flex: 1;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text-sub);
    padding: 6px 0;
    border-radius: 6px;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
  }

  .duration-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }

  .contract-actions {
    display: flex;
    gap: 8px;
  }

  .resign-btn,
  .release-btn {
    flex: 1;
    border: none;
    border-radius: 6px;
    padding: 8px 0;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
  }

  .resign-btn {
    background: var(--accent);
    color: #ffffff;
  }

  .resign-btn:disabled {
    background: var(--border);
    color: var(--text-sub);
    cursor: not-allowed;
  }

  .release-btn {
    background: #ffffff;
    border: 1px solid var(--border);
    color: var(--text-sub);
  }

  .release-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .cap-warning {
    margin: 8px 0 0;
    font-size: 0.75rem;
    color: var(--accent);
    text-align: center;
  }

  /* 出場時間配分タブ */
  .rotation-block {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }

  .rotation-position-row {
    display: flex;
    gap: 6px;
    margin-bottom: 10px;
  }

  .position-btn {
    flex: 1;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text-sub);
    padding: 6px 0;
    border-radius: 6px;
    font-size: 0.8rem;
    font-family: inherit;
    cursor: pointer;
  }

  /* 適性ポジション（本来の持ち場）を枠線と文字色で示す */
  .position-btn--eligible {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: bold;
  }

  .position-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }

  /* -5/-1/+1/+5の4ボタン＋中央のラベル。5つ並んでも狭い画面に収まるよう
     余白を詰めてある。1分刻みだが、1分ずつ48回押さずに済むようにしている。 */
  .rotation-minutes-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .minutes-btn {
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text-sub);
    padding: 6px 8px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-family: inherit;
    cursor: pointer;
  }

  .minutes-btn:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  .minutes-label {
    min-width: 3em;
    text-align: center;
    font-weight: bold;
    font-size: 0.9rem;
  }

  /* 試合結果タブ */
  .games-progress {
    font-size: 0.85rem;
    color: var(--text-sub);
    margin: 0 0 10px;
  }

  .games-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .games-advance-btn {
    flex: 1;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text-sub);
    padding: 8px 4px;
    border-radius: 6px;
    font-size: 0.78rem;
    font-family: inherit;
    cursor: pointer;
  }

  .games-advance-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .games-advance-btn--all {
    color: var(--accent);
  }

  .games-empty {
    color: var(--text-sub);
    font-size: 0.875rem;
    text-align: center;
    padding: 24px 16px;
  }

  .game-log {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .game-entry {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
  }

  .game-entry--expanded {
    border-color: var(--accent);
  }

  .game-entry-header {
    width: 100%;
    display: flex;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
    background: #ffffff;
    border: none;
    padding: 10px 12px;
    font-family: inherit;
    text-align: left;
    cursor: pointer;
  }

  .game-entry-num {
    font-size: 0.7rem;
    color: var(--text-sub);
    flex: 0 0 auto;
  }

  .game-entry-opponent {
    font-size: 0.85rem;
    flex: 1 1 auto;
  }

  .game-entry-score {
    font-size: 0.9rem;
    font-weight: bold;
    color: var(--text-sub);
    white-space: nowrap;
  }

  .game-entry-score--win {
    color: var(--accent);
  }

  .game-boxscore {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.8rem;
  }

  .game-boxscore th,
  .game-boxscore td {
    padding: 6px 8px;
    text-align: left;
    border-top: 1px solid var(--border);
  }

  .game-boxscore th {
    font-size: 0.7rem;
    font-weight: normal;
    color: var(--text-sub);
    background: var(--accent-pale);
  }

  footer {
    max-width: 480px;
    margin: 2rem auto 0;
    padding: 1.5rem 1.5rem 3rem;
    border-top: 1px solid var(--border);
    font-size: 0.8125rem;
    color: var(--text-sub);
    text-align: center;
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
  }

  footer a:hover,
  footer a:focus-visible {
    text-decoration: underline;
  }

  /* 「追い風」への文字リンクと見分けがつくよう、枠付きのボタンにする
     （以前は文字装飾だけで、リンクと区別がつかなかった。誤って
     サイトへのリンクを押してしまう恐れもあった）。取り消せない操作
     （セーブデータを消す）なので、他のボタンより控えめな色にしてある。 */
  .restart-btn {
    display: inline-block;
    margin-left: 10px;
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text-sub);
    padding: 5px 12px;
    border-radius: 14px;
    font-size: inherit;
    font-family: inherit;
    cursor: pointer;
  }

  .restart-btn:hover,
  .restart-btn:focus-visible {
    border-color: var(--accent);
    color: var(--accent);
  }
</style>
</head>
<body>

<div class="top-bar">
  <p class="app-title">育成バスケ</p>
  <div class="tabs" id="tabs"></div>
  <div class="season-bar">
    <span class="season-label" id="season-label">シーズン1</span>
    <button class="season-btn" id="advance-season-btn">次のシーズンへ進む</button>
  </div>
</div>

<main>
  <div id="tab-content"></div>
</main>

<footer>
  <a href="../">追い風</a>
  <button id="restart-btn" class="restart-btn">最初からやり直す</button>
</footer>

<!--
  script2つはfooterより後に置かない。ui.jsの末尾で同期的にinit()を呼んで
  おり、document.getElementById("restart-btn")がその時点で存在する必要が
  ある。以前footerがscriptより後にあったとき、restart-btnがまだDOMに
  無く.addEventListener()がnullエラーで失敗し、「最初からやり直す」の
  クリックが一切反応しない不具合があった（ユーザー報告）。
-->
<script src="game.js"></script>
<script src="ui.js"></script>

</body>
</html>
