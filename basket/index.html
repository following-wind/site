<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>育成バスケ</title>
<meta name="description" content="架空のバスケリーグを何年も育てる、ブラウザだけで遊べる育成ゲームです。">

<!--
  ============================================================
  進み具合について
  ============================================================
  今は「自チーム」「順位表」「FA市場」タブがあります。
  契約更改タブは、後で足す予定です。
  タブの中身はui.jsのTABS配列で定義していて、
  新しいタブを足すときはそこに{id, label, render}を1つ追加するだけでOK。
  計算そのもの（選手生成・成長・年俸など）はgame.jsにあり、
  ここ（index.html / ui.js）は画面表示だけを担当します。
  ============================================================
-->

<style>
  :root {
    --accent: #7B4FBF;
    --accent-pale: #F2ECFC;
    --bar-track: #EAE7E2;
    --text: #2C2C2A;
    --text-sub: #5F5E5A;
    --border: #D3D1C7;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    background: #ffffff;
    color: var(--text);
    font-family: "Meiryo UI", Meiryo, "Hiragino Kaku Gothic ProN", sans-serif;
  }

  .top-bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: #ffffff;
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    text-align: center;
  }

  .app-title {
    font-size: 0.75rem;
    letter-spacing: 0.1em;
    color: var(--text-sub);
    margin: 0 0 10px;
  }

  /* タブ切り替えボタン。tips/index.htmlの.tab-btnと同じ見た目に揃えた */
  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }

  .tab-btn {
    border: 1px solid var(--border);
    background: #ffffff;
    color: var(--text-sub);
    padding: 6px 14px;
    border-radius: 16px;
    font-size: 0.85rem;
    font-family: inherit;
    cursor: pointer;
  }

  .tab-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
  }

  .tab-btn.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #ffffff;
  }

  .team-name {
    font-size: 1.15rem;
    font-weight: bold;
    margin: 0 0 12px;
  }

  main {
    max-width: 480px;
    margin: 0 auto;
    padding: 16px 16px 60px;
  }

  /* スマホは1人1カードを縦積み。PC幅は左右の余白が目立つので2列にする。
     自チーム・FA市場など、カードを並べるタブで共通に使う。 */
  .card-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 12px;
  }

  @media (min-width: 640px) {
    main {
      max-width: 900px;
    }

    .card-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  .player-card {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    background: #ffffff;
  }

  .player-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 12px;
  }

  .player-name {
    font-size: 1rem;
    font-weight: bold;
    line-break: strict;
  }

  .player-meta {
    flex: 0 0 auto;
    font-size: 0.8rem;
    color: var(--text-sub);
    white-space: nowrap;
  }

  /* 総合力・年俸のバッジ。tips/index.htmlの.card-keysと同じ見た目に揃えた */
  .player-stats-line {
    display: flex;
    gap: 6px;
    margin-bottom: 12px;
  }

  .stat-chip {
    background: var(--accent-pale);
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: bold;
    padding: 4px 8px;
    border-radius: 4px;
  }

  /* 能力5項目。数字は並べず、5本の縦バーで見せる */
  .ability-bars {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }

  .bar-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 高さは固定60px。バー自体の高さ(px)はui.js側で40〜99を0〜60pxに
     直接計算して埋め込む（%指定だとネストしたflexの中でラベル分
     目減りして差が見えにくかったため、pxの実寸指定にした） */
  .bar-track {
    width: 100%;
    max-width: 26px;
    height: 60px;
    display: flex;
    align-items: flex-end;
  }

  .bar-fill {
    width: 100%;
    background: var(--bar-track);
    border-radius: 3px 3px 0 0;
  }

  /* その選手の最も高い項目だけ色を変える */
  .bar-fill--top {
    background: var(--accent);
  }

  .bar-label {
    font-size: 0.7rem;
    color: var(--text-sub);
    margin-top: 4px;
  }

  .growth-hint {
    margin-top: 10px;
    text-align: right;
    font-size: 0.75rem;
    color: var(--text-sub);
  }

  .growth-hint .value {
    display: inline-block;
    min-width: 1.4em;
    font-weight: bold;
    color: var(--accent);
  }

  /* 順位表。4チームだけなので表を横に並べても崩れない */
  .standings {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.9rem;
  }

  .standings th,
  .standings td {
    padding: 10px 8px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }

  .standings th {
    font-size: 0.75rem;
    font-weight: normal;
    color: var(--text-sub);
  }

  /* 自チームの行だけ強調する */
  .standings-row--mine {
    background: var(--accent-pale);
    font-weight: bold;
  }

  .standings-row--mine td:first-child {
    border-left: 4px solid var(--accent);
    padding-left: 4px;
  }

  /* FA市場: オフシーズン経過を動かすと、下の要求額バッジが値下がりする */
  .fa-controls {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 12px;
  }

  .fa-week-label {
    display: block;
    font-size: 0.85rem;
    color: var(--text-sub);
    margin-bottom: 8px;
  }

  .fa-week-label strong {
    color: var(--accent);
  }

  .fa-week-slider {
    width: 100%;
    accent-color: var(--accent);
  }

  .fa-discount-line {
    font-size: 0.75rem;
    color: var(--text-sub);
    margin-top: -6px;
    margin-bottom: 12px;
  }

  .fa-discount-line .original {
    text-decoration: line-through;
  }

  footer {
    max-width: 480px;
    margin: 2rem auto 0;
    padding: 1.5rem 1.5rem 3rem;
    border-top: 1px solid var(--border);
    font-size: 0.8125rem;
    color: var(--text-sub);
    text-align: center;
  }

  footer a {
    color: var(--accent);
    text-decoration: none;
  }

  footer a:hover,
  footer a:focus-visible {
    text-decoration: underline;
  }
</style>
</head>
<body>

<div class="top-bar">
  <p class="app-title">育成バスケ</p>
  <div class="tabs" id="tabs"></div>
</div>

<main>
  <div id="tab-content"></div>
</main>

<script src="game.js"></script>
<script src="ui.js"></script>

<footer>
  <a href="../">追い風</a>
</footer>

</body>
</html>
